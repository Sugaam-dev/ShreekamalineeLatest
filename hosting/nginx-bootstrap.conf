# Optional bootstrap: valid before certificates exist. No application traffic.
server {
    listen 80;
    listen [::]:80;
    server_name shreekamalinee.com www.shreekamalinee.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
